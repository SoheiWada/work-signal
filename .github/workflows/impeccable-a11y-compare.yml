name: Impeccable candidate comparison (temporary)

on:
  push:
    branches:
      - fix/work-signal-a11y-20261103
    paths:
      - .github/workflows/impeccable-a11y-compare.yml

permissions:
  contents: read

jobs:
  compare:
    if: github.ref == 'refs/heads/fix/work-signal-a11y-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the candidate locally (no deployment)
        run: |
          python -m pip install -r requirements-build.txt
          python3 scripts/build_site.py
      - name: Start isolated static preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/preview-http.log 2>&1 &
          for i in {1..15}; do
            if curl --fail -s http://127.0.0.1:8765/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview-http.log
          exit 1
      - name: Run detector on changed source and rendered preview
        env:
          DO_NOT_TRACK: '1'
          CI: 'true'
        shell: bash
        run: |
          mkdir -p a11y-comparison
          targets=(index.html article.html http://127.0.0.1:8765/ http://127.0.0.1:8765/)
          labels=(index article desktop mobile)
          bad=0
          for i in "${!targets[@]}"; do
            label="${labels[$i]}"
            args=()
            if [[ "$label" == "mobile" ]]; then args=(--viewport 390x844); fi
            if npx --yes impeccable@4.8.0 detect --json "${args[@]}" "${targets[$i]}" > "a11y-comparison/$label.json" 2>"a11y-comparison/$label.err.txt"; then
              result=0
            else
              result=$?
            fi
            echo "$label detector_exit=$result"
            if [[ "$result" != 0 && "$result" != 2 ]]; then
              bad=1
            fi
          done
          python3 - <<'PY'
          import json,collections,pathlib
          d=pathlib.Path('a11y-comparison')
          for name in ('index','article','desktop','mobile'):
              try: raw=json.loads((d/(name+'.json')).read_text())
              except Exception as exc: print(name,'read error',exc);continue
              print(name,'primary',sum(not v.get('advisory') for v in raw),'advisory',sum(bool(v.get('advisory')) for v in raw))
              print('  rules',dict(collections.Counter(v['antipattern'] for v in raw)))
          PY
          exit "$bad"
      - name: Capture desktop and mobile preview images
        if: always()
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,900 --virtual-time-budget=3000 --screenshot=a11y-comparison/desktop.png http://127.0.0.1:8765/ || true
            google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=3000 --screenshot=a11y-comparison/mobile.png http://127.0.0.1:8765/ || true
          fi
      - name: Upload findings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-a11y-candidate
          path: a11y-comparison/
          if-no-files-found: warn
          retention-days: 14
