name: Recover transient WORK SIGNAL Pages failures
on:
  workflow_run:
    workflows: ["Build and deploy WORK SIGNAL"]
    types: [completed]
    branches: [main]
permissions:
  actions: write
  contents: read
concurrency:
  group: pages-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'timed_out' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry only the current timed-out production revision once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "Superseded revision; normal main build handles recovery." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest=$(gh api "repos/$REPO/actions/workflows/pages.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].id')
          if [[ "$latest" != "$RUN_ID" ]]; then
            echo "Newer Pages run exists; no retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          state=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '[.status,.conclusion,(.run_attempt|tostring)]|join(":")')
          if [[ "$state" != "completed:timed_out:1" ]]; then
            echo "Run no longer eligible; no retry." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun"
          echo "One bounded retry requested; deployment is not yet confirmed." >> "$GITHUB_STEP_SUMMARY"
