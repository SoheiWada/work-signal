name: Build and deploy WORK SIGNAL
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate market data safety and provider adapter
        run: node --test tests/market/*.test.mjs
      - name: Validate legacy article URLs
        run: node --test tests/seo/*.test.mjs
      - name: Validate NBA result calculations and court motion
        run: node --test tests/nba/*.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install image build dependency
        run: python -m pip install -r requirements-build.txt
      - uses: actions/configure-pages@v5
      - name: Validate static site generation
        run: python3 -m unittest discover -s tests
      - name: Build crawlable pages
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
