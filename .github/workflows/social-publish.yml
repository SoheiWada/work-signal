name: Publish approved WORK SIGNAL social posts

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: "Verified deployed commit SHA (blank for manual/scheduled runs)"
        required: false
        type: string
      article_ids:
        description: "Comma-separated newly approved article IDs; blank = approved backlog"
        required: false
        type: string
      continuation_depth:
        description: "Internal bounded continuation count (0-2)"
        required: false
        default: '0'
        type: string
  workflow_run:
    workflows: ["Build and deploy WORK SIGNAL"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: work-signal-social-publishing
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      vars.SOCIAL_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exactly the successfully deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deployed_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify published source and allow only ledger changes
        env:
          EXPECTED_SHA: ${{ inputs.deployed_sha || github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/verify_deployed_revision.py
      - name: Validate social publisher
        run: |
          python -m pip install -r requirements-build.txt
          python -m unittest discover -s tests -p 'test_social_publish.py'
          python -m unittest discover -s tests -p 'test_delivery_reliability.py'
          python -m unittest discover -s tests -p 'test_delivery_channel_outcomes.py'
          python -m unittest discover -s tests -p 'test_approved_social_event.py'
          python -m unittest discover -s tests -p 'test_scheduled_social.py'
          python -m unittest discover -s tests -p 'test_social_queue.py'
          python -m unittest discover -s tests -p 'test_social_preflight.py'
      - name: Reconcile only freshness-reviewed missing posts
        # A newly approved article cannot authorize recovery of unrelated posts.
        if: inputs.article_ids == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/reconcile_social_recovery.py
      - name: Choose a bounded batch from the durable approved backlog
        id: scheduled
        env:
          REQUESTED_ARTICLE_IDS: ${{ inputs.article_ids }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/social_queue.py prepare
      - name: Publish explicitly approved articles
        if: steps.scheduled.outputs.ready == 'true'
        id: publish
        # A known Meta Instagram FEED hold is not a Threads failure.
        # The next step ONLY permits that explicit hold. All other failures
        # remain red and missing reports always fail.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOCIAL_PUBLISH_ENABLED: ${{ vars.SOCIAL_PUBLISH_ENABLED }}
          SOCIAL_REPORT_ENABLED: 'true'
          SOCIAL_PREFLIGHT_HISTORY: 'true'
          SOCIAL_SCOPE_ARTICLE_IDS: ${{ steps.scheduled.outputs.article_ids }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/publish_social.py --live
      - name: Verify Threads and Stories delivery separately from IG feed protective hold
        if: always() && steps.publish.outcome != 'skipped' && steps.publish.outcome != ''
        env:
          SOCIAL_SCOPE_ARTICLE_IDS: ${{ steps.scheduled.outputs.article_ids }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_social_channel_outcomes.py
      - name: Diagnose Instagram review states (read only)
        if: always() && steps.scheduled.outputs.ready == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/diagnose_instagram.py
      - name: Report the entire approved backlog and permit only bounded progress
        if: always()
        id: backlog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUESTED_ARTICLE_IDS: ${{ inputs.article_ids }}
          CONTINUATION_DEPTH: ${{ inputs.continuation_depth || '0' }}
        run: python scripts/social_queue.py finish
      - name: Continue only after confirmed progress (at most two additional batches)
        if: steps.backlog.outputs.continue_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DEPTH: ${{ steps.backlog.outputs.next_depth }}
        run: gh workflow run social-publish.yml --ref main -f "continuation_depth=$NEXT_DEPTH"
      - name: Keep per-platform completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-signal-social-delivery-status
          path: |
            social-delivery-status.json
            social-backlog-status.json
          retention-days: 14
          if-no-files-found: ignore

  publish-x:
    # A separate completion state: Meta failures never skip X, and X failures
    # cannot prevent Meta delivery. The workflow-level common lock serializes
    # ALL writers to the shared durable ledger (including scheduled recovery).
    needs: publish
    if: always() && needs.publish.result != 'skipped' && vars.SOCIAL_PUBLISH_ENABLED == 'true' && vars.X_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.deployed_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install official X text parser
        run: npm --prefix tools/x-publisher ci --ignore-scripts --no-audit --no-fund
      - name: Verify deployed revision independently of Meta
        env:
          EXPECTED_SHA: ${{ inputs.deployed_sha || github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/verify_deployed_revision.py
      - name: Publish new approved X articles within the JST daily cap
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOCIAL_PUBLISH_ENABLED: ${{ vars.SOCIAL_PUBLISH_ENABLED }}
          X_PUBLISH_ENABLED: ${{ vars.X_PUBLISH_ENABLED }}
          X_PUBLISH_START_SHA: ${{ vars.X_PUBLISH_START_SHA }}
          X_USERNAME: ${{ vars.X_USERNAME }}
          X_USER_ID: ${{ vars.X_USER_ID }}
          X_SCOPE_ARTICLE_IDS: ${{ inputs.article_ids }}
          X_REPORT_ENABLED: 'true'
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/publish_x.py --live
      - name: Keep independent X completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-signal-x-delivery-status
          path: x-delivery-status.json
          retention-days: 14
          if-no-files-found: ignore

