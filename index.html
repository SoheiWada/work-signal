<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="忙しい働く人のために、AI・仕事・マネジメント・経済の重要ニュースを一次情報に基づいて解説。">
<title>WORK SIGNAL | ニュースは短く、意味は深く。</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#202126;background:#f7f7fa}
*{box-sizing:border-box}body{margin:0}a{color:inherit}header,main,footer{max-width:1040px;margin:auto;padding:24px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd}header strong{letter-spacing:.08em;font-size:1.25rem}header span{font-size:.8rem;color:#727480}
.hero{background:#26243a;color:white;border-radius:20px;padding:clamp(26px,6vw,60px);margin:28px 0}.hero small{color:#e5cafa;letter-spacing:.12em}.hero h1{font-size:clamp(1.9rem,5vw,3.5rem);line-height:1.35;margin:12px 0}.hero p{color:#ebe6f5}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}button{border:1px solid #dcdce5;border-radius:100px;padding:9px 16px;background:white;cursor:pointer;font:inherit}button.active{background:#26243a;color:white}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:white;border:1px solid #e7e7ed;border-radius:16px;padding:22px}.meta{font-size:.8rem;color:#6c6a7d}.score{display:inline-block;border:1px solid #dcd4ef;padding:3px 8px;border-radius:8px;margin-right:8px}.card h2{font-size:1.15rem;line-height:1.5}.card p{line-height:1.75;color:#575665}.card a{font-weight:bold;text-underline-offset:4px}
.empty{background:white;border:1px dashed #d9d5e3;border-radius:16px;padding:42px;text-align:center;color:#666477}
footer{font-size:.8rem;color:#73717f;border-top:1px solid #ddd;margin-top:50px;line-height:1.8}
</style></head><body>
<header><strong>◉ WORK SIGNAL</strong><span>NEWS THAT MATTERS.</span></header>
<main><section class="hero"><small>CURATED NEWS FOR WORKING PEOPLE</small><h1>ニュースは短く。<br>意味は深く。</h1><p>AI・仕事・マネジメント・お金・経済・Crypto。一次情報を確かめ、働く人に関係するニュースだけを届けます。</p></section>
<h2>最新のシグナル</h2><nav id="filters" aria-label="カテゴリー"></nav><section class="cards" id="articles" aria-live="polite"></section>
</main><footer>WORK SIGNAL | 掲載内容は独自の解説です。出典を明示し、事実と考察を区別します。投資判断を推奨するものではありません。</footer>
<script>
const categories=['すべて','AI','仕事','マネジメント','お金','経済','Crypto'];let active='すべて',items=[];
const filters=document.querySelector('#filters'),root=document.querySelector('#articles');
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function render(){filters.replaceChildren();categories.forEach(c=>{const b=el('button',c);b.className=c===active?'active':'';b.onclick=()=>{active=c;render()};filters.append(b)});
root.replaceChildren();const selected=items.filter(a=>active==='すべて'||a.category===active);if(!selected.length){root.append(el('div','公開準備中です。一次情報を確認した記事から順次掲載します。','empty'));return}
selected.forEach(a=>{const card=el('article',undefined,'card');const meta=el('div',undefined,'meta');meta.append(el('span',a.score+'点','score'),document.createTextNode(a.category+' ・ '+a.published_at));card.append(meta,el('h2',a.title),el('p',a.summary));const link=el('a','一次情報を読む →');link.href=a.source_url;link.target='_blank';link.rel='noopener noreferrer';card.append(link);root.append(card)})}
fetch('./data/articles.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('data unavailable');return r.json()}).then(data=>{items=Array.isArray(data)?data.filter(a=>a.status==='published'&&a.score>=80&&/^https:\/\//.test(a.source_url)):[];render()}).catch(()=>render());
</script></body></html>
