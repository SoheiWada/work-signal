name: Audit five uncertain Threads posts 2026-10-29 (read only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-threads-five-20261029.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read Threads posts and original container status, no writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/audit_threads_five_20261029.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-five-audit-20261029
          path: threads-five-audit.json
          retention-days: 14
