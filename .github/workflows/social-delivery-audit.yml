name: Audit WORK SIGNAL live social delivery
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_social_delivery.py
      - .github/workflows/social-delivery-audit.yml
      - .github/social-recovery-review.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image comparison dependency
        run: python -m pip install -r requirements-build.txt
      - name: Reconcile live media and quota without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/audit_social_delivery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-signal-social-delivery-audit
          path: social-delivery-audit.json
          retention-days: 14
