name: Validate WORK SIGNAL security social assets

on:
  push:
    branches: [main]
    paths:
      - scripts/social_asset_design.py
      - scripts/build_site.py
      - tests/test_social_asset_design.py
      - .github/workflows/social-assets-design-ci.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image-generation test requirements
        run: python -m pip install -r requirements-build.txt
      - name: Validate image templates, one-line severity and approval routing
        id: tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python -m py_compile scripts/social_asset_design.py scripts/build_site.py
          python - <<'PY'
          import importlib.util
          import io
          import json
          import os
          import unittest
          from urllib.request import Request, urlopen
          
          spec = importlib.util.spec_from_file_location(
              "security_card_tests", "tests/test_social_asset_design.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          methods = [
              "test_explicit_tag_only_and_invalid_value_fails_closed",
              "test_critical_never_wraps_and_fits_within_image",
              "test_feed_and_story_have_expected_distinct_dark_themes",
              "test_build_routes_only_explicit_severity_and_keeps_standard_unchanged",
          ]
          failures = []
          for method in methods:
              output = io.StringIO()
              suite = unittest.TestSuite([module.SecurityAssetDesignTests(method)])
              result = unittest.TextTestRunner(stream=output, verbosity=2).run(suite)
              ok = result.wasSuccessful()
              payload = json.dumps({
                  "state": "success" if ok else "failure",
                  "context": "SECURITY asset / " + method,
                  "description": "Design test passed" if ok else "Design test failed (no SNS publish)"
              }).encode()
              url = ("https://api.github.com/repos/"
                     + os.environ["REPOSITORY"] + "/statuses/" + os.environ["SHA"])
              req = Request(url, method="POST", data=payload, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"
              })
              with urlopen(req, timeout=20) as response:
                  if response.status != 201:
                      raise RuntimeError("Unable to report status")
              print(("PASS " if ok else "FAIL ") + method)
              if not ok:
                  failures.append(method)
                  # Test log only; no secrets are passed to any test subprocess.
                  print(output.getvalue()[-5000:])
          if failures:
              raise SystemExit(1)
          PY
      - name: Publish check result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TEST_STATUS: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          passed = os.getenv("TEST_STATUS") == "success"
          status = {
              "state": "success" if passed else "failure",
              "context": "WORK SIGNAL / Security social design tests",
              "description": ("SECURITY WATCH feed/Story design and CRITICAL layout passed"
                              if passed else "Security image tests need attention")
          }
          url = ("https://api.github.com/repos/"
                 + os.environ["REPOSITORY"] + "/statuses/" + os.environ["SHA"])
          req = Request(url, method="POST", data=json.dumps(status).encode(), headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "User-Agent": "WORK-SIGNAL-SocialAssets-CI/1.0",
          })
          with urlopen(req, timeout=20) as response:
              if response.status != 201:
                  raise RuntimeError("Unable to report test status")
          PY
