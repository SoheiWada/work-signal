name: One-time approved Threads dispatch 2026-10-31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-approved-threads-20261031.yml'

permissions:
  actions: write
  contents: read

jobs:
  scoped-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Verify 31 October JST and exact editor-approved articles
        shell: bash
        run: |
          test "$(TZ=Asia/Tokyo date +%F)" = "2026-10-31" || { echo "One-day approval expired"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path("data/articles.json").read_text())
          targets={
            "20261031-traefik-fastproxy-http1-upgrade-dos-cve-2026-119574": ("SECURITY", 80),
            "20261031-uk-drcf-agentic-ai-business-responsibility": ("AI", 85),
          }
          for aid,(category,minimum) in targets.items():
              hits=[a for a in feed if a.get("id")==aid]
              assert len(hits)==1, f"missing/duplicate ID: {aid}"
              a=hits[0]
              assert a.get("status")=="published" and a.get("social_publish") is True
              assert a.get("social_platforms")==["threads"], f"unexpected platforms: {aid}"
              assert a.get("published_at")=="2026-10-31" and a.get("category")==category
              assert a.get("score",0)>=minimum
              assert a.get("source_url","").startswith("https://") and len(a.get("sections",[]))>=2
          print("Exactly two reviewed new articles approved, Threads only")
          PY
      - name: Wait for matching production GitHub Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ github.sha }}
        run: |
          found=0
          for i in $(seq 1 90); do
            test "$(TZ=Asia/Tokyo date +%F)" = "2026-10-31" || exit 1
            main_sha=$(gh api "repos/$REPO/commits/main" --jq '.sha')
            test "$main_sha" = "$CURRENT" || { echo "Main moved; do not dispatch stale approval"; exit 1; }
            status=$(gh api "repos/$REPO/actions/workflows/pages.yml/runs?branch=main&per_page=20" --jq ".workflow_runs[] | select(.head_sha == \"$CURRENT\") | .status + \":\" + (.conclusion // \"\")" | head -n 1)
            if [ "$status" = "completed:success" ]; then found=1; break; fi
            if [ "$status" = "completed:failure" ] || [ "$status" = "completed:cancelled" ]; then
              echo "Pages did not deploy successfully: $status"; exit 1
            fi
            sleep 8
          done
          test "$found" -eq 1 || { echo "No successful Pages deployment for current SHA"; exit 1; }
      - name: Dispatch ONLY the two fresh approved Threads articles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ github.sha }}
        run: |
          test "$(TZ=Asia/Tokyo date +%F)" = "2026-10-31" || exit 1
          test "$(gh api "repos/$REPO/commits/main" --jq '.sha')" = "$CURRENT" || exit 1
          gh workflow run social-publish.yml --ref main \
            -f "deployed_sha=$CURRENT" \
            -f "article_ids=20261031-traefik-fastproxy-http1-upgrade-dos-cve-2026-119574,20261031-uk-drcf-agentic-ai-business-responsibility"
          echo "Requested independently scoped publisher. Success must be verified in its own run and the per-platform ledger."
