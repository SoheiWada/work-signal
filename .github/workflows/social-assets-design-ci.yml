name: Validate WORK SIGNAL security social assets

on:
  push:
    branches: [main]
    paths:
      - scripts/social_asset_design.py
      - scripts/build_site.py
      - tests/test_social_asset_design.py
      - .github/workflows/social-assets-design-ci.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image-generation test requirements
        run: python -m pip install -r requirements-build.txt
      - name: Validate image templates, one-line severity and approval routing
        id: tests
        run: |
          python -m py_compile scripts/social_asset_design.py scripts/build_site.py
          python -m unittest discover -s tests -p 'test_social_asset_design.py' -v
      - name: Publish check result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TEST_STATUS: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          passed = os.getenv("TEST_STATUS") == "success"
          status = {
              "state": "success" if passed else "failure",
              "context": "WORK SIGNAL / Security social design tests",
              "description": ("SECURITY WATCH feed/Story design and CRITICAL layout passed"
                              if passed else "Security image tests need attention")
          }
          url = ("https://api.github.com/repos/"
                 + os.environ["REPOSITORY"] + "/statuses/" + os.environ["SHA"])
          req = Request(url, method="POST", data=json.dumps(status).encode(), headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "User-Agent": "WORK-SIGNAL-SocialAssets-CI/1.0",
          })
          with urlopen(req, timeout=20) as response:
              if response.status != 201:
                  raise RuntimeError("Unable to report test status")
          PY
