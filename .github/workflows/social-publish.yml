name: Publish approved WORK SIGNAL social posts

on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
  workflow_run:
    workflows: ["Build and deploy WORK SIGNAL"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: work-signal-social-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')) &&
      vars.SOCIAL_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the successfully deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify published source and allow only ledger changes
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/verify_deployed_revision.py
      - name: Validate social publisher
        run: |
          python -m pip install -r requirements-build.txt
          python -m unittest discover -s tests -p 'test_social_publish.py'
          python -m unittest discover -s tests -p 'test_delivery_reliability.py'
      - name: Reconcile only freshness-reviewed missing posts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/reconcile_social_recovery.py
      - name: Publish explicitly approved articles
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOCIAL_PUBLISH_ENABLED: ${{ vars.SOCIAL_PUBLISH_ENABLED }}
          SOCIAL_REPORT_ENABLED: 'true'
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/publish_social.py --live
      - name: Diagnose Instagram review states (read only)
        if: always()
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/diagnose_instagram.py
      - name: Keep per-platform completion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-signal-social-delivery-status
          path: social-delivery-status.json
          retention-days: 14
          if-no-files-found: ignore

