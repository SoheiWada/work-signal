name: Refresh free NBA display data
on:
  schedule:
    - cron: '23 10,22 * * *'
  workflow_dispatch:

# Disabled until the free key is configured and the integration is verified.
# Standard hosted runners are free for this public repository. Never run on a private repo.
permissions:
  contents: write
  actions: write
concurrency:
  group: nba-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.repository.private == false && vars.NBA_DATA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch only free Teams and Games endpoints
        id: fetch
        continue-on-error: true
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: node scripts/fetch_nba.mjs
      - name: Validate the public snapshot
        run: |
          node --input-type=module - <<'JS'
          import {readFile} from 'node:fs/promises';
          import {parseNbaSnapshot} from './nba/feed.mjs';
          parseNbaSnapshot(JSON.parse(await readFile('nba/data.json','utf8')));
          JS
      - name: Publish data or refresh failure status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba/data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh NBA display snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
          # A GITHUB_TOKEN push does not trigger the Pages push workflow.
          gh workflow run pages.yml --ref main
      - name: Report provider failure after preserving the last good snapshot
        if: steps.fetch.outcome == 'failure'
        run: exit 1
