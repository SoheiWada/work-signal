name: Publish approved WORK SIGNAL social posts

on:
  workflow_run:
    workflows: ["Build and deploy WORK SIGNAL"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: work-signal-social-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.SOCIAL_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the successfully deployed revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate social publisher
        run: python -m unittest discover -s tests -p 'test_social_publish.py'
      - name: Publish explicitly approved articles
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOCIAL_PUBLISH_ENABLED: ${{ vars.SOCIAL_PUBLISH_ENABLED }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/publish_social.py --live
