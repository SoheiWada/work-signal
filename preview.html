 const raw=typeof a.quick_take==='string'?a.quick_take.trim():'';
 if(!raw)return null;
 const normalize=value=>String(value||'').normalize('NFKC').toLocaleLowerCase('ja')
  .replace(/[\s、。.,!！?？:：;；「」『』（）()【】]/g,'');

   followIntro.append(el('p','FOLLOW THE SIGNAL','article-share-title'),el('h3','この先の変化も、追うなら。'),el('p','AI・仕事・経済の変化を、一次情報から。次の判断材料を、公式SNSでも。'));
   const policy=el('a','WORK SIGNALの編集方針','article-follow-policy');policy.href='/about/#editorial-policy';followIntro.append(policy);

     const link=el('a',undefined,'article-follow-link');link.href=href;link.target='_blank';link.rel='noopener noreferrer';

   const share=el('div',undefined,'article-share');

function fail(){const robots=document.createElement('meta');robots.name='robots';robots.content='noindex';document.head.append(robots);root.replaceChildren();const wrap=el('section',undefined,'notfound');wrap.append(el('div','/ SIGNAL NOT FOUND','eyebrow'),el('h1','NO SIGNAL.'),el('p','記事が見つからないか、まだ公開されていません。'));const a=el('a','記事一覧へ戻る','back');a.href='./#latest';wrap.append(a);root.append(wrap);document.title='記事が見つかりません — WORK SIGNAL';measurePageView()}
function render(a){
root.replaceChildren();const banner=el('div','EDITORIAL PREVIEW — 未公開の確認用原稿','eyebrow');banner.style.cssText='padding:20px 0;border-bottom:1px solid var(--orange)';root.append(banner);const effective=readingFormat(a),deep=effective==='deep_dive',hasSections=Array.isArray(a.sections)&&a.sections.length>0;
const special=effective==='special_story',guide=effective==='management_guide';
const formatLabel=guide?'MANAGEMENT GUIDE · 独自解説':special?'SPECIAL STORY · 自社製品紹介':deep?'SIGNAL DEEP DIVE':'SIGNAL BRIEF';
const hero=el('section',undefined,'hero article-hero');
if(a.category==='SECURITY')hero.append(securityWatchReturn(a,'top'));
const kicker=el('div',undefined,'article-kicker');
kicker.append(el('span','/ WORK SIGNAL / '+a.category,'article-kicker-category'),
              el('span',formatLabel,'article-type'));
hero.append(kicker,el('h1',a.title));
const meta=el('div',undefined,'meta article-meta');
const pub=el('span',undefined,'article-meta-published');
const date=el('time',a.published_at);date.dateTime=a.published_at;
pub.append(el('span','PUBLISHED','article-meta-label'),date);meta.append(pub);
meta.append(articleReadtimeMark(a));hero.append(meta);
const layout=el('div',undefined,'layout'),content=el('article',undefined,'content');content.append(el('p',a.summary,'lead'));
const toc=[];
if(hasSections){
const uniqueQuickTake=distinctQuickTake(a);if(uniqueQuickTake){const box=el('section',undefined,'takeaways');box.append(el('h2','30秒でわかる / THE SIGNAL'),el('p',uniqueQuickTake));content.append(box)}
a.sections.forEach((part,i)=>{if(!part||!part.title||!part.body)return;const sec=el('section',undefined,'block');sec.id='section-'+(i+1);sec.append(el('h2',part.title));const paragraphs=String(part.body).split(/\n\s*\n/).filter(Boolean);paragraphs.forEach(p=>sec.append(el('p',p)));if(Array.isArray(part.stats))part.stats.forEach(stat=>{if(!stat||!stat.value)return;const box=el('div',undefined,'stat');box.append(el('strong',String(stat.value)),el('span',stat.label||''));sec.append(box)});content.append(sec);toc.push({id:sec.id,title:part.title})});
}else{
for(const [title,key] of [['何が起きた？','what_happened'],['なぜ重要？','why_it_matters'],['仕事や暮らしへの影響','impact'],['確認しておきたいこと','caveats']]){const sec=section(title,a[key]);if(sec)content.append(sec)}
}
const aside=el('aside',undefined,'side');aside.append(el('div','ARTICLE INTELLIGENCE','side-title'));const dl=el('dl');for(const [k,v] of [['FORMAT',formatLabel],['READ TIME',String(readingMinutes(a)).padStart(2,'0')+' MIN'],['CATEGORY',a.category],['SIGNAL SCORE',a.score+' / 100'],['PUBLISHED',a.published_at]]){dl.append(el('dt',k),el('dd',v))}aside.append(dl);
if(toc.length){const nav=el('nav',undefined,'toc');nav.setAttribute('aria-label','記事の目次');nav.append(el('div','IN THIS STORY','side-title'));toc.forEach(item=>{const l=el('a',item.title);l.href='#'+item.id;nav.append(l)});aside.append(nav)}
const source=el('div',undefined,'source');source.append(el('small','/ PRIMARY SOURCE'));const link=el('a',a.source_url);link.href=a.source_url;link.target='_blank';link.rel='noopener noreferrer';source.append(link);aside.append(source,el('p','この記事は一次情報に基づく独自の要約・考察です。掲載内容は投資助言ではありません。','note'));layout.append(content,aside);root.append(hero,layout,articleEnd(a,true));document.title=a.title+' — WORK SIGNAL';
const desc=document.querySelector('meta[name="description"]');desc.content=a.summary;articleMetadata(a);measurePageView()}

if(!id||id.length>120){fail()}else{fetch('./data/drafts.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{const a=Array.isArray(items)?items.find(x=>x.id===id&&x.status==='draft'&&x.score>=80&&typeof x.source_url==='string'&&/^https:\/\//.test(x.source_url)):null;if(a)render(a);else fail()}).catch(fail)}
