name: Check WORK SIGNAL X account (GET only)

on:
  workflow_dispatch:
    inputs:
      identify_only:
        description: 'First setup: display connected username/ID without posting'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify intended X account without posting or modifying the ledger
        env:
          X_USERNAME: ${{ vars.X_USERNAME }}
          X_USER_ID: ${{ vars.X_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          IDENTIFY_ONLY: ${{ inputs.identify_only }}
        run: |
          if [ "$IDENTIFY_ONLY" = 'true' ]; then
            python scripts/publish_x.py --identify
          else
            python scripts/publish_x.py --check
          fi
