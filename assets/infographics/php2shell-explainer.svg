<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">PHPの脆弱性で何が起きるのか</title><desc id="d">攻撃者の特殊な通信がPHPのメモリ処理の不具合を引き起こし、条件によってサーバーの不正操作につながる可能性を示す図</desc><rect width="1200" height="900" fill="#f5f3ee"/><text x="50" y="80" font-size="45" font-weight="800" fill="#172438" font-family="sans-serif">PHPの脆弱性で、何が起きる？</text><text x="50" y="125" font-size="23" fill="#4d5866" font-family="sans-serif">ログインしていなくても攻撃されるおそれ。その仕組みを4ステップで解説</text><g font-family="sans-serif" text-anchor="middle"><rect x="42" y="165" width="260" height="350" rx="20" fill="#fff" stroke="#cbd5df"/><circle cx="172" cy="216" r="30" fill="#253a50"/><text x="172" y="226" font-size="28" fill="white">1</text><text x="172" y="278" font-size="24" font-weight="700" fill="#172438">攻撃者が</text><text x="172" y="311" font-size="24" font-weight="700" fill="#172438">特殊な通信を送る</text><text x="172" y="385" font-size="73">✉</text><text x="172" y="452" font-size="19" fill="#485668">ログインなしでも</text><text x="172" y="480" font-size="19" fill="#485668">届く場合がある</text><rect x="327" y="165" width="260" height="350" rx="20" fill="#fff" stroke="#cbd5df"/><circle cx="457" cy="216" r="30" fill="#253a50"/><text x="457" y="226" font-size="28" fill="white">2</text><text x="457" y="278" font-size="24" font-weight="700" fill="#172438">PHPの内部で</text><text x="457" y="311" font-size="24" font-weight="700" fill="#172438">処理ミスが発生</text><text x="457" y="390" font-size="72" fill="#df422c">!</text><text x="457" y="452" font-size="19" fill="#485668">使い終えたメモリ等を</text><text x="457" y="480" font-size="19" fill="#485668">誤って扱う</text><rect x="612" y="165" width="260" height="350" rx="20" fill="#fff" stroke="#cbd5df"/><circle cx="742" cy="216" r="30" fill="#253a50"/><text x="742" y="226" font-size="28" fill="white">3</text><text x="742" y="278" font-size="24" font-weight="700" fill="#172438">悪用に成功すると</text><text x="742" y="311" font-size="24" font-weight="700" fill="#172438">不正な処理が動く</text><rect x="673" y="350" width="138" height="73" rx="12" fill="#eff2f6"/><text x="742" y="398" font-size="38" font-weight="700" fill="#df422c">&lt;/&gt;</text><text x="742" y="470" font-size="19" fill="#485668">条件が成立した場合</text><rect x="897" y="165" width="260" height="350" rx="20" fill="#fff" stroke="#cbd5df"/><circle cx="1027" cy="216" r="30" fill="#253a50"/><text x="1027" y="226" font-size="28" fill="white">4</text><text x="1027" y="278" font-size="24" font-weight="700" fill="#172438">サーバーを</text><text x="1027" y="311" font-size="24" font-weight="700" fill="#172438">不正操作される</text><rect x="975" y="347" width="104" height="80" rx="12" fill="#273d55"/><path d="M992 372h70 M992 394h70" stroke="white" stroke-width="5"/><text x="1027" y="470" font-size="19" fill="#485668">さまざまな被害へ</text></g><g fill="#42576b"><path d="M308 327h16v-12l15 20-15 20v-12h-16z"/><path d="M593 327h16v-12l15 20-15 20v-12h-16z"/><path d="M878 327h16v-12l15 20-15 20v-12h-16z"/></g><rect x="42" y="560" width="1115" height="232" rx="20" fill="#fff2f0" stroke="#f0c5bf"/><text x="75" y="611" font-family="sans-serif" font-size="29" font-weight="800" fill="#ad2618">想定される被害</text><g font-family="sans-serif" text-anchor="middle" fill="#9c251c"><text x="240" y="674" font-size="26" font-weight="700">情報漏えい</text><text x="600" y="674" font-size="26" font-weight="700">サイトの改ざん</text><text x="965" y="674" font-size="26" font-weight="700">サーバーの悪用</text></g><g font-family="sans-serif" text-anchor="middle" fill="#4e555c" font-size="20"><text x="240" y="717">顧客情報・認証情報など</text><text x="600" y="717">表示内容の書き換えなど</text><text x="965" y="717">別の攻撃への踏み台など</text></g><rect x="42" y="813" width="1115" height="60" rx="12" fill="#f9ded9"/><text x="600" y="852" font-family="sans-serif" font-size="24" text-anchor="middle" font-weight="700" fill="#a72c1b">対策：PHPの緊急修正版を適用し、更新後の動作を確認する</text><text x="50" y="893" font-family="sans-serif" font-size="13" fill="#6c7279">WORK SIGNAL｜仕組みの概念図。すべての環境で攻撃が成立するという意味ではありません。</text></svg>