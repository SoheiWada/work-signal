name: Build and deploy WORK SIGNAL
on:
  push:
    branches: [main, 'fix/**']
    # The social ledger is intentionally not deployed. Its many per-post
    # writes must not cancel builds or re-trigger social publisher workflows.
    paths-ignore:
      - '.github/social-post-ledger.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR/feature validation must not cancel a main production deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate market data safety and provider adapter
        run: node --test tests/market/*.test.mjs
      - name: Validate legacy article URLs
        run: node --test tests/seo/*.test.mjs
      - name: Validate NBA result calculations and court motion
        run: node --test tests/nba/*.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install image build dependency
        run: python -m pip install -r requirements-build.txt
      - uses: actions/configure-pages@v5
      # Website quality checks must not depend on Meta API publishing logic.
      # Publisher safeguards remain enforced by social-publisher-ci.yml.
      - name: Validate site generation, SEO and SECURITY WATCH assets
        run: |
          python3 -m unittest discover -s tests -p 'test_topic_pages.py'
          python3 -m unittest discover -s tests -p 'test_related_articles.py'
          python3 -m unittest discover -s tests -p 'test_build_site.py'
          python3 -m unittest discover -s tests -p 'test_security_watch.py'
          python3 -m unittest discover -s tests -p 'test_approved_social_event.py'
          python3 -m unittest discover -s tests -p 'test_scheduled_social.py'
          python3 -m unittest discover -s tests -p 'test_seo_metadata.py'
          python3 -m unittest discover -s tests -p 'test_publication_timeline.py'
          python3 -m unittest discover -s tests -p 'test_market_assets.py'
          python3 -m unittest discover -s tests -p 'test_market_preview.py'
          python3 -m unittest discover -s tests -p 'test_nba_assets.py'
          python3 -m unittest discover -s tests -p 'test_social_asset_design.py'
      - name: Build crawlable pages
        run: python3 scripts/build_site.py
      - name: Verify website and SECURITY WATCH published output
        run: |
          python3 -m scripts.check_site_output
          python3 -m scripts.audit_seo_output
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
