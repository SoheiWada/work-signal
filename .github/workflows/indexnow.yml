name: Notify search engines via IndexNow
on:
  workflow_run:
    workflows: ["Build and deploy WORK SIGNAL"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: work-signal-indexnow
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: indexnow-approved-feed
          path: indexnow-input
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Restore last acknowledged article snapshot
        uses: actions/cache/restore@v5
        with:
          path: indexnow-state/articles.json
          key: work-signal-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: work-signal-indexnow-v1-
      - name: Check live deployment and submit changed article URLs
        id: submit
        run: |
          python3 -m scripts.indexnow indexnow-input/articles.json indexnow-state/articles.json "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Save acknowledged article snapshot
        if: steps.submit.outputs.updated == 'true'
        uses: actions/cache/save@v5
        with:
          path: indexnow-state/articles.json
          key: work-signal-indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
